# Clean install, build and test this package across the supported platforms.
# Mirrors voxgig/sdkgen's build workflow.
#
# NOTE: this repo previously had NO CI of its own. The only workflow it
# contained was project/standard/.github/workflows/ci.yml, which is SHIPPED to
# generated SDKs and never runs here — so the suite that guards the shared test
# corpus (test/corpus.test.ts) ran nowhere.

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    # `npm test` runs the compiled dist-test/ suite. Without a build first,
    # node --test matches zero files and exits 0 — green CI testing nothing.
    - run: npm run build
    - run: npm test

  # A real scaffold, installed with the published toolchain and generated, on
  # Linux and Windows: launching npm, resolving the model's includes and the
  # .sdk npm scripts are platform-specific, and the unit tests can only stub
  # the platform. Windows is advisory until it has had a green run.
  scaffold:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24.x
    - run: npm ci
    - run: node bin/create-sdkgen petstore -d test/fixture/petstore.yaml -o "$RUNNER_TEMP/petstore-sdk" -t ts -f test
    - run: node -e "require('fs').statSync(process.argv[1])" "$RUNNER_TEMP/petstore-sdk/.sdk/model/target/ts.aontu"
    # The spec through the model to the test model: every include resolves.
    - run: npm run generate
      working-directory: ${{ runner.temp }}/petstore-sdk/.sdk
    - run: node -e "require('fs').statSync(process.argv[1])" "$RUNNER_TEMP/petstore-sdk/ts/package.json"
    # The .sdk scripts run under cmd.exe on Windows, whatever shell this step uses.
    - run: npm run status
      working-directory: ${{ runner.temp }}/petstore-sdk/.sdk
    - run: npm run clean
      working-directory: ${{ runner.temp }}/petstore-sdk/.sdk
    - run: |
        node -e "process.exit(require('fs').existsSync(process.argv[1]) ? 1 : 0)" "$RUNNER_TEMP/petstore-sdk/.sdk/node_modules"
